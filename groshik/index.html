<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Грошик</title>
<style>
:root{--bg:#f6f1e7;--ink:#2b2622;--accent:#d8553f}
@media (prefers-color-scheme:dark){:root{--bg:#1d1a17;--ink:#f1eadd;--accent:#ef7a63}}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:flex;align-items:center;justify-content:center;padding:48px 16px;text-align:center}
main{max-width:520px}
.coin{width:96px;height:96px;margin:0 auto 32px;border-radius:50%;border:3px solid var(--ink);background:var(--accent)}
h1{font-size:clamp(40px,10vw,64px);margin:0 0 16px;letter-spacing:-.02em}
p{font-size:20px;line-height:1.5;margin:0}
</style>
</head>
<body>
<main>
<div class="coin" aria-hidden="true"></div>
<h1>Грошик</h1>
<p>Сімейний бюджет, в якому всі на одній сторінці.</p>
</main>
</body>
</html>
