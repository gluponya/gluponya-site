<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<script src="/st/mock_hub.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Алерт доната и Twitch</title>
<link rel="stylesheet" href="/static/hub.css">
<style>
  /* Три уровня алерта по сумме: «Оня рада» (маленький, сбоку), «Оня супер рада» (средний, сбоку, искры),
     «Оня супер мега дупер рада!!!» (большой, по центру сверху, конфетти и тряска). */
  :root{
    --pink:#FF7ABE; --pink-hot:#FF4FA3; --mint:#78EEC4; --plum:#2E0C24;
    --cream:#FFF8FB; --yellow:#FFD84D; --violet:#9146FF; --card:#45173A; --muted:#D9B8CC;
    --shadow:0 12px 28px rgba(20,4,15,.45);
    --display:"Rubik","Nunito",sans-serif; --body:"Nunito","Rubik",sans-serif;
  }
  html,body{margin:0;height:100%;background:transparent;overflow:hidden}
  body.preview{background:repeating-conic-gradient(#241020 0 25%, #2c1428 0 50%) 0 0/40px 40px}
  *{box-sizing:border-box}
  #fx{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:5}
  /* погода за баллы: под алертами и виджетами, поверх всего остального на экране */
  #wx{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:1}

  .alert{position:absolute;z-index:3}
  .card{position:relative;background:var(--card);border-radius:28px;box-shadow:var(--shadow)}
  .label{position:absolute;left:24px;top:0;transform:translateY(-55%) rotate(-3deg);white-space:nowrap;
         font:900 24px/1 var(--display);text-transform:uppercase;letter-spacing:.03em;color:var(--plum);
         padding:10px 16px 8px;border-radius:10px;box-shadow:0 6px 14px rgba(20,4,15,.35);z-index:3}
  .amount{position:absolute;background:var(--yellow);color:var(--plum);font:900 46px/1 var(--display);
          padding:12px 20px 10px;border-radius:18px;box-shadow:var(--shadow);transform:rotate(5deg);white-space:nowrap;z-index:3}
  .name{font:900 40px/1.1 var(--display);color:var(--cream);text-transform:uppercase;
        white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .via{margin-top:8px;font:800 22px/1.25 var(--body);color:var(--muted)}
  .via b{color:var(--mint);font-weight:900}
  .msg{margin-top:16px;font:800 32px/1.32 var(--body);color:var(--cream);overflow-wrap:anywhere}
  .msg:empty{display:none}
  .amount .usd{font-size:.6em;opacity:.8}
  .meme{position:absolute;z-index:4;filter:drop-shadow(0 12px 22px rgba(20,4,15,.5))}
  .meme img{width:100%;height:100%;object-fit:contain;animation:wobble 2.2s ease-in-out infinite;transform-origin:50% 80%}
  @keyframes wobble{0%,100%{transform:rotate(-7deg)}50%{transform:rotate(7deg) scale(1.04)}}
  /* Клодик: оранжевая искорка с глазками, пока ответ на экране — «говорит» */
  .klod svg{width:100%;height:100%;overflow:visible;animation:kbob 1.8s ease-in-out infinite;transform-origin:50% 60%}
  .klod .eyes{animation:kblink 3.6s infinite;transform-origin:50% 46%}
  .klod .mouth{animation:ktalk .32s ease-in-out infinite alternate;transform-origin:50% 60%}
  .klod.quiet .mouth{animation:none;transform:scaleY(.25)}
  .klod.sync .mouth{animation:none;transform:scaleY(.2)}
  .klod .tear{animation:ktear 1.6s ease-in infinite}
  .klod.m-angry svg{animation:kshake .3s ease-in-out infinite}
  .klod.m-shock svg{animation:kjump .9s ease-in-out infinite}
  .klod.m-love svg{animation:kbob 1.1s ease-in-out infinite}
  .klod.m-stars svg{animation:kjump .7s ease-in-out infinite}
  .klod.m-stars .eyes{animation:none}
  .klod.m-stars .eyes path{animation:kspin 2.4s linear infinite;transform-box:fill-box;transform-origin:50% 50%}
  .klod.m-scared svg{animation:kshiver .12s linear infinite}
  .klod.m-sleepy svg{animation:kbob 3.4s ease-in-out infinite}
  .klod.m-sleepy .eyes,.klod.m-cry .eyes,.klod.m-cool .eyes,.klod.m-wink .eyes{animation:none}
  .klod .tears path{animation:ktear 1.1s ease-in infinite}
  .klod .tears path+path{animation-delay:-.5s}
  .klod .zzz text{animation:kz 2.4s ease-in-out infinite;opacity:0}
  .klod .zzz text:nth-child(2){animation-delay:.8s}.klod .zzz text:nth-child(3){animation-delay:1.6s}
  .klod .dots circle{animation:kdot 1.5s infinite;opacity:.2}
  .klod .dots circle:nth-child(2){animation-delay:.3s}.klod .dots circle:nth-child(3){animation-delay:.6s}
  .klod .sweat{animation:ktear 1.4s ease-in infinite}
  .klod.m-judge .eyes,.klod.m-scheme .eyes,.klod.m-confused .eyes,.klod.m-eyeroll .eyes{animation:none}
  .klod .shifty{animation:kshifty 2.2s ease-in-out infinite}
  .klod .roll{animation:kroll 2.6s ease-in-out infinite}
  .klod .mark{animation:kmark 1.2s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
  .klod.m-scheme svg{animation:kbob 2.6s ease-in-out infinite}
  @keyframes kshifty{0%,15%,100%{transform:translateX(0)}30%,50%{transform:translateX(-2.2px)}65%,85%{transform:translateX(2.2px)}}
  @keyframes kroll{0%,100%{transform:translate(0,0)}25%{transform:translate(2.2px,1px)}50%{transform:translate(0,-.6px)}75%{transform:translate(-2.2px,1px)}}
  @keyframes kmark{0%,100%{transform:rotate(-10deg) scale(1)}50%{transform:rotate(10deg) scale(1.15)}}
  @keyframes kspin{to{transform:rotate(360deg)}}
  @keyframes kshiver{0%,100%{transform:translateX(0)}50%{transform:translateX(1.5%)}}
  @keyframes kz{0%{opacity:0;transform:translateY(4px)}30%,70%{opacity:1}100%{opacity:0;transform:translateY(-6px)}}
  @keyframes kdot{0%,100%{opacity:.2}50%{opacity:1}}
  @keyframes ktear{0%{transform:translateY(0);opacity:1}80%{transform:translateY(9px);opacity:1}100%{transform:translateY(11px);opacity:0}}
  @keyframes kshake{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg) scale(1.04)}}
  @keyframes kjump{0%,100%{transform:translateY(0) scale(1)}30%{transform:translateY(-8%) scale(1.1)}}
  @keyframes kbob{0%,100%{transform:rotate(-5deg) scale(1)}50%{transform:rotate(5deg) scale(1.06)}}
  @keyframes kblink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
  @keyframes ktalk{0%{transform:scaleY(.25)}60%{transform:scaleY(1)}100%{transform:scaleY(.55)}}

  /* у маленького и среднего подпись «Оня рада» висит на нижнем краю карточки справа */
  .t0 .label,.t1 .label{top:auto;bottom:0;left:auto;right:28px;transform:translateY(55%) rotate(-3deg)}
  /* 1. Оня рада: компактно сбоку */
  .t0{width:470px;padding-top:70px}
  .t0 .card{border:3px solid var(--mint);padding:40px 26px 34px 26px}
  .t0 .label{background:var(--mint);font-size:20px}
  .t0 .amount{top:-24px;right:18px;font-size:34px;padding:9px 15px 8px;background:var(--mint)}
  .t0 .meme{top:0;left:-28px;width:140px;height:140px}
  .t0.has-meme .name,.t0.has-meme .via{padding-left:96px}

  .t0 .name{font-size:30px} .t0 .via{font-size:18px} .t0 .msg{font-size:26px;margin-top:12px}

  /* 2. Оня супер рада: сбоку, крупнее, розовая рамка */
  .t1{width:600px;padding-top:110px}
  .t1 .card{border:4px solid var(--pink);padding:58px 34px 42px 34px}
  .t1 .label{background:var(--pink)}
  .t1 .amount{top:-30px;right:24px;background:var(--pink)}
  .t1 .meme{top:0;left:-40px;width:200px;height:200px}
  .t1.has-meme .name,.t1.has-meme .via{padding-left:142px}


  /* 3. Оня супер мега дупер рада!!!: по центру сверху, большая, светится */
  .t2{width:820px;padding-top:150px;left:50%;margin-left:-410px}
  .t2 .name{padding-right:250px}
  .t2 .card{border:6px solid var(--pink-hot);padding:74px 44px 36px 44px;
            animation:glow 1.1s ease-in-out infinite alternate}
  @keyframes glow{from{box-shadow:0 0 0 0 rgba(255,79,163,.0),var(--shadow)}to{box-shadow:0 0 46px 10px rgba(255,79,163,.55),var(--shadow)}}
  .t2 .label{left:50%;top:-150px;background:var(--pink-hot);font-size:40px;padding:14px 24px 11px;animation:shout .9s ease-in-out infinite}
  @keyframes shout{0%,100%{transform:translateX(-50%) rotate(-3deg) scale(1)}50%{transform:translateX(-50%) rotate(2deg) scale(1.06)}}
  .t2 .amount{top:-36px;right:30px;font-size:60px;background:var(--yellow)}
  .t2 .meme{bottom:-60px;right:-70px;width:260px;height:260px}
  .t2.has-meme .msg{padding-right:170px}
  .t2.has-meme .card{min-height:250px}
  .t2 .name{font-size:52px} .t2 .via{font-size:24px} .t2 .msg{font-size:36px}
  /* сабки: в центре экрана, а не сбоку */
  .alert.mid{left:50%} .t0.mid{margin-left:-235px} .t1.mid{margin-left:-300px}

  /* алерты Twitch: свой цвет у каждого события */
  .th-violet .card{border-color:var(--violet)} .th-violet .label{background:var(--violet);color:var(--cream)} .th-violet .amount{background:var(--violet);color:var(--cream)}
  .th-yellow .card{border-color:var(--yellow)} .th-yellow .label{background:var(--yellow)} .th-yellow .amount{background:var(--yellow)}
  .th-mint .card{border-color:var(--mint)} .th-mint .label{background:var(--mint)} .th-mint .amount{background:var(--mint)}
  .th-hot .card{border-color:var(--pink-hot)} .th-hot .label{background:var(--pink-hot);color:var(--cream)} .th-hot .amount{background:var(--yellow)}
  .th-violet.t2 .card{animation:glowv 1.1s ease-in-out infinite alternate}
  @keyframes glowv{from{box-shadow:0 0 0 0 rgba(145,70,255,0),var(--shadow)}to{box-shadow:0 0 46px 10px rgba(145,70,255,.6),var(--shadow)}}
  .sticker img{animation-duration:1.6s}

  /* ставки и опросы за баллы: виджеты сверху по центру, друг под другом */
  #topw{position:absolute;top:22px;left:50%;width:620px;margin-left:-310px;z-index:2;display:flex;flex-direction:column;gap:14px}
  .pw{display:none}
  .pw .card{border:4px solid var(--yellow);padding:20px 24px 18px}
  .pw .ph{display:flex;align-items:center;justify-content:space-between;gap:12px}
  .pw .chip{background:var(--yellow);color:var(--plum);font:900 20px/1 var(--display);text-transform:uppercase;
              padding:8px 12px 6px;border-radius:10px;transform:rotate(-3deg);box-shadow:0 6px 14px rgba(20,4,15,.35)}
  .pw .tm{font:900 26px/1 var(--display);color:var(--mint);font-variant-numeric:tabular-nums}
  .pw .tm.lock{color:var(--muted);font-size:18px;text-transform:uppercase}
  .pw .pt{margin:14px 0 12px;font:900 30px/1.15 var(--display);color:var(--cream)}
  .pw .o{position:relative;height:46px;border-radius:14px;background:#2a0c22;overflow:hidden;margin-top:8px;transition:opacity .4s}
  .pw .o i{position:absolute;inset:0 auto 0 0;border-radius:14px;opacity:.9;transition:width .6s cubic-bezier(.2,.9,.3,1)}
  .pw .o .ot{position:absolute;left:14px;top:0;bottom:0;display:flex;align-items:center;font:900 22px/1 var(--body);color:var(--cream);
               text-shadow:0 2px 6px rgba(20,4,15,.7);max-width:58%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .pw .o .on{position:absolute;right:14px;top:0;bottom:0;display:flex;align-items:center;gap:10px;font:900 19px/1 var(--body);
               color:var(--cream);text-shadow:0 2px 6px rgba(20,4,15,.7)}
  .pw .o .on b{font:900 24px/1 var(--display)}
  .pw .o .on small{font-size:16px;color:var(--yellow)}
  .pw .o.lose{opacity:.38}
  .pw .o.win{box-shadow:0 0 0 3px var(--yellow),0 0 26px 4px rgba(255,216,77,.5)}
  .pw .pf{margin-top:12px;font:800 18px/1.2 var(--body);color:var(--muted)}
  .pw .pf b{color:var(--yellow)}

  #poll .card{border-color:var(--mint)} #poll .chip{background:var(--mint)}
  #poll .o.lead{box-shadow:0 0 0 3px var(--mint)}
  @media (prefers-reduced-motion:reduce){*{animation:none!important}}
  .th-blue .card{border-color:#7ACBFF} .th-blue .label{background:#7ACBFF} .th-blue .amount{background:#7ACBFF}
  .th-custom .card{border-color:var(--c)} .th-custom .label{background:var(--c)} .th-custom .amount{background:var(--c)}
  .big-emoji{display:flex;align-items:center;justify-content:center;font-size:110px;line-height:1}
  .big-emoji span{display:inline-block;animation:wobble 2.2s ease-in-out infinite;transform-origin:50% 80%}
  .t0 .big-emoji{font-size:96px} .t1 .big-emoji{font-size:140px}

  /* ---- таро: карта дня (переворот рубашки, свечение по редкости, предсказание) ---- */
  .tarot{position:absolute;left:50%;top:50%;z-index:4;width:400px;margin-left:-200px;margin-top:-430px;text-align:center}
  .tarot .tlab{display:block;width:max-content;max-width:620px;position:relative;left:50%;font:900 26px/1 var(--display);text-transform:uppercase;
               color:var(--plum);background:var(--yellow);padding:10px 18px 8px;border-radius:12px;transform:translateX(-50%) rotate(-3deg);
               box-shadow:var(--shadow);margin-bottom:18px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .tarot .flip{position:relative;width:400px;height:689px;perspective:1600px}
  .tarot .in{position:absolute;inset:0;transform-style:preserve-3d;transition:transform 1s cubic-bezier(.3,1.4,.5,1)}
  .tarot.open .in{transform:rotateY(180deg)}
  .tarot .face{position:absolute;inset:0;backface-visibility:hidden;border-radius:20px;overflow:hidden}
  .tarot .face img{width:100%;height:100%;display:block}
  .tarot .front{transform:rotateY(180deg)}
  .tarot .glow{position:absolute;inset:-6px;border-radius:26px;pointer-events:none;opacity:0;transition:opacity .6s .9s}
  .tarot.open .glow{opacity:1;animation:tGlow 2.2s ease-in-out 1.5s infinite}
  @keyframes tGlow{0%,100%{filter:brightness(1)}50%{filter:brightness(1.5)}}
  .tarot.rare .glow{box-shadow:0 0 30px 8px rgba(110,170,240,.85)}
  .tarot.myth .glow{box-shadow:0 0 38px 12px rgba(190,120,255,.9),0 0 80px 20px rgba(244,156,185,.5)}
  .tarot.legend .glow{box-shadow:0 0 44px 14px rgba(255,214,120,.95),0 0 110px 34px rgba(244,156,185,.6)}
  .tarot.common .glow{box-shadow:0 12px 28px rgba(20,4,15,.45)}
  .tarot .tsay{margin:18px auto 0;max-width:460px;margin-left:-30px;margin-right:-30px;background:var(--card);border-radius:18px;padding:14px 18px;
               font:800 24px/1.3 var(--body);color:var(--cream);box-shadow:var(--shadow);opacity:0;transition:opacity .5s 1.3s}
  .tarot .tsay b{display:block;font:900 18px/1 var(--display);text-transform:uppercase;letter-spacing:.04em;margin-bottom:6px}
  .tarot.open .tsay{opacity:1}
  .tarot.common .tsay b{color:var(--muted)} .tarot.rare .tsay b{color:#8FC2FF}
  .tarot.myth .tsay b{color:#D3A6FF} .tarot.legend .tsay b{color:var(--yellow)}

  /* !профиль — карточка зрителя: сбоку, как алерты */
  .prof{position:absolute;z-index:4;width:600px;background:var(--card);border-radius:30px;box-shadow:var(--shadow);
        border:4px solid var(--pink);padding:30px 28px 24px;color:var(--cream);font-family:var(--body)}
  .prof .plab{position:absolute;left:26px;top:0;transform:translateY(-55%) rotate(-3deg);background:var(--yellow);color:var(--plum);
        font:900 24px/1 var(--display);text-transform:uppercase;letter-spacing:.03em;padding:10px 16px 8px;border-radius:10px;
        box-shadow:0 6px 14px rgba(20,4,15,.35);white-space:nowrap}
  .prof .ph{display:flex;gap:20px;align-items:center}
  .prof .ava{flex:0 0 112px;height:112px;border-radius:50%;border:5px solid var(--yellow);box-shadow:0 0 0 4px var(--plum);
        background:var(--plum);overflow:hidden;display:grid;place-items:center;font-size:58px}
  .prof .ava img{width:100%;height:100%;object-fit:cover;display:block}
  .prof .pn{min-width:0;flex:1}
  .prof .nm{font:900 40px/1.05 var(--display);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .prof .chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
  .prof .chip{font:900 17px/1 var(--display);text-transform:uppercase;letter-spacing:.03em;padding:8px 12px 7px;border-radius:10px;
        background:var(--mint);color:var(--plum)}
  .prof .chip.t{background:var(--yellow);color:var(--plum);transform:rotate(-3deg)}
  .prof .chip.s{background:var(--violet);color:#fff} .prof .chip.v{background:var(--pink-hot);color:#fff}
  .prof .since{margin-top:8px;font:800 17px/1.2 var(--body);color:var(--muted)}
  .prof .bar{margin:20px 0 4px;height:14px;border-radius:8px;background:rgba(0,0,0,.28);overflow:hidden}
  .prof .bar i{display:block;height:100%;width:0;border-radius:8px;background:linear-gradient(90deg,var(--pink),var(--yellow));
        transition:width 1.2s cubic-bezier(.2,.9,.3,1) .5s}
  .prof .bart{font:800 15px/1 var(--body);color:var(--muted);text-align:right}
  .prof .st{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:16px}
  .prof .st div{background:rgba(0,0,0,.22);border-radius:16px;padding:12px 6px 10px;text-align:center}
  .prof .st b{display:block;font:900 30px/1 var(--display);color:var(--yellow)}
  .prof .st span{display:block;margin-top:6px;font:800 15px/1.1 var(--body);color:var(--muted)}
  .prof .ach{display:grid;grid-template-columns:repeat(8,1fr);gap:6px;margin-top:16px}
  .prof .ach div{aspect-ratio:1;border-radius:12px;display:grid;place-items:center;font-size:26px;background:rgba(255,255,255,.1)}
  .prof .ach div.on{background:rgba(255,216,77,.2);box-shadow:inset 0 0 0 2px var(--yellow)}
  .prof .ach div.on.r3{background:rgba(160,110,255,.28);box-shadow:inset 0 0 0 2px #C59BFF}
  .prof .ach div.on.r4{background:rgba(255,120,190,.28);box-shadow:inset 0 0 0 3px #FF8CC6,0 0 14px rgba(255,140,198,.7)}
  .prof .ach div.off{filter:grayscale(1);opacity:.28}
  .prof .pets{display:flex;gap:10px;margin-top:16px}
  .prof .pets>div{flex:1;min-width:0;display:flex;align-items:center;gap:10px;background:rgba(0,0,0,.22);border-radius:16px;padding:4px 14px 4px 4px}
  .prof .pets img{flex:0 0 72px;width:72px;height:72px;object-fit:contain;transform:scale(1.5)}
  .prof .pets b{display:block;font:900 19px/1.1 var(--body);color:var(--mint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .prof .pets span{display:block;font:800 14px/1.1 var(--body);color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .prof .af{margin-top:12px;font:900 18px/1 var(--display);text-transform:uppercase;letter-spacing:.04em;color:var(--mint)}
  /* Скин «Терминал» (07.11): ровные плашки, углы, свечение; карточки берут общий набор из hub.css */
  :root[data-skin="terminal"] .card { border-width: 3px !important; }
  :root[data-skin="terminal"] .label { border-radius: 2px; transform: translateY(-55%); box-shadow: 0 0 18px -4px var(--pink); }
  :root[data-skin="terminal"] .label::before { content: "> "; }
  :root[data-skin="terminal"] .t0 .label, :root[data-skin="terminal"] .t1 .label { transform: translateY(55%); }
  :root[data-skin="terminal"] .t2 .label { animation: t-shout .9s steps(2, end) infinite; }
  @keyframes t-shout { 0%, 100% { transform: translateX(-50%); } 50% { transform: translateX(-50%) scale(1.05); } }
  :root[data-skin="terminal"] .amount { border-radius: 3px; transform: none; box-shadow: 0 0 22px -4px var(--yellow); }
  :root[data-skin="terminal"] .pw .chip, :root[data-skin="terminal"] .prof .chip.t { border-radius: 2px; transform: none !important; }
  :root[data-skin="terminal"] .tarot .tlab { border-radius: 2px; transform: translateX(-50%); }
  :root[data-skin="terminal"] .prof .plab { border-radius: 2px; transform: translateY(-55%); }
  /* ===== Формы оверлея (07.11): карточки берут общий набор из hub.css, здесь подписи, сумма и текст ===== */
  :root[data-skin="notebook"] .label { border-radius: 4px; box-shadow: none; }
  :root[data-skin="notebook"] .amount { border-radius: 4px; box-shadow: none; transform: rotate(3deg); font: 700 54px/1 var(--hand); font-style: var(--hand-style, italic); }
  :root[data-skin="notebook"] .name { color: var(--ink); } :root[data-skin="notebook"] .via { color: var(--soft); }
  :root[data-skin="notebook"] .msg { color: var(--ink); font: 700 38px/1.2 var(--hand); font-style: var(--hand-style, italic); }
  :root[data-skin="notebook"] .t2 .card { animation: none; }

<script>
(() => {
  const P = new URLSearchParams(location.search);
  const side = P.get('side') === 'left' ? 'left' : 'right';
  const top = parseInt(P.get('top') || '90', 10);

  const fmt = n => Math.round(n).toLocaleString('ru-RU').replace(/\s/g, ' ');

  const VIA = { donatello: 'Donatello', mono: 'банку моно', kofi: 'Ko-fi', test: 'тест' };
  const LABELS = ['Оня рада', 'Оня супер рада', 'Оня супер мега дупер рада!!!'];
  let sym = '₴', usdRate = 0;
  const usd = a => usdRate > 0 && sym === '₴' ? ` <span class="usd">≈ $${Math.max(1, Math.round(a / usdRate))}</span>` : '';
  let sounds = [{ from: 0, file: 'meow_cartoon.mp3' }, { from: 100, file: 'meow_purr.mp3' },
                { from: 500, file: 'meow_begging.mp3', then: 'purr.mp3' }];
  // запросы к Глупостанции не висят дольше 4 с (AbortSignal.timeout есть не во всех версиях OBS)
  const T = ms => { if (window.AbortSignal && AbortSignal.timeout) return AbortSignal.timeout(ms);
                    const c = new AbortController(); setTimeout(() => c.abort(), ms); return c.signal; };
  const getJ = async u => { const r = await fetch(u, { cache: 'no-store', signal: T(4000) }); if (!r.ok) throw new Error(r.status); return r.json(); };
  // рукопожатие с озвучкой: «донат в очереди / выехал / уехал» — озвучка читает сообщение, когда алерт уже на экране
  let hs = false;
  const tell = (id, state) => { if (hs && id) fetch('/hub/tts/alert', { method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ id: String(id), state }), signal: T(4000) }).catch(() => {}); };

  // уровень = номер ступени в настройке sounds (до 100, 100–499, от 500)
  function tierOf(amount) {
    let t = 0;
    sounds.forEach((s, i) => { if (amount >= (s.from || 0)) t = i; });
    return Math.min(t, 2);
  }
  function play(files) {
    let i = 0;
    const next = () => {
      if (i >= files.length) return;
      const a = new Audio('sounds/' + encodeURIComponent(files[i++]));
      a.volume = vol; a.onended = next; a.play().catch(() => {});
    };
    next();
  }

  // ---- искры и конфетти ----
  const cv = document.getElementById('fx'), cx = cv.getContext('2d');
  let parts = [], raf = 0;
  const fit = () => { cv.width = innerWidth; cv.height = innerHeight; };
  fit(); addEventListener('resize', fit);
  const COLORS = ['#78EEC4', '#FF7ABE', '#FFD84D', '#FFF8FB', '#FF4FA3'];
  // конфетти и искры в текущей палитре (если зритель перекрасил оверлей — в его цветах)
  const LIVE = ['--mint', '--pink', '--yellow', '--cream', '--pink-hot'];
  const confCol = i => getComputedStyle(document.documentElement).getPropertyValue(LIVE[i % LIVE.length]).trim() || COLORS[i % COLORS.length];
  function burst(x, y, n, spread, big) {
    for (let i = 0; i < n; i++) {
      const a = Math.random() * Math.PI * 2, v = (big ? 9 : 5) * (0.4 + Math.random());
      parts.push({ x, y, vx: Math.cos(a) * v * spread, vy: Math.sin(a) * v - (big ? 6 : 3),
                   r: big ? 6 + Math.random() * 8 : 3 + Math.random() * 4, rot: Math.random() * 6, vr: (Math.random() - .5) * .3,
                   c: confCol(i), life: big ? 200 : 70, star: !big || i % 4 === 0 });
    }
    if (!raf) raf = requestAnimationFrame(tick);
  }
  function rain(n) {
    for (let i = 0; i < n; i++) parts.push({ x: Math.random() * cv.width, y: -20 - Math.random() * 400, vx: (Math.random() - .5) * 2,
      vy: 2 + Math.random() * 3, r: 6 + Math.random() * 7, rot: Math.random() * 6, vr: (Math.random() - .5) * .2,
      c: confCol(i), life: 420, star: i % 5 === 0 });
    if (!raf) raf = requestAnimationFrame(tick);
  }
  function star(r) { cx.beginPath(); for (let i = 0; i < 8; i++) { const rr = i % 2 ? r * .42 : r, a = i * Math.PI / 4; cx.lineTo(Math.cos(a) * rr, Math.sin(a) * rr); } cx.closePath(); cx.fill(); }
  function tick() {
    cx.clearRect(0, 0, cv.width, cv.height);
    parts = parts.filter(p => p.life-- > 0 && p.y < cv.height + 40);
    for (const p of parts) {
      p.vy += 0.18; p.vx *= .99; p.x += p.vx; p.y += p.vy; p.rot += p.vr;
      cx.save(); cx.translate(p.x, p.y); cx.rotate(p.rot); cx.globalAlpha = Math.min(1, p.life / 30); cx.fillStyle = p.c;
      if (p.star) star(p.r); else cx.fillRect(-p.r, -p.r * .45, p.r * 2, p.r * .9);
      cx.restore();
    }
    raf = parts.length ? requestAnimationFrame(tick) : 0;
  }


  // ---- погода за баллы: снег, звездопад, конфетти, листопад, сердечки, пузыри, котики, дождь ----
  // Идёт secs секунд: 2 с набирает силу, последние 2,5 с стихает, потом всё, что уже летит, долетает.
  // Цвета берёт из текущей палитры оверлея (настроение или перекраска от зрителя), обводки сливовые, как в брендбуке.
  const wc = document.getElementById('wx'), wx = wc.getContext('2d');
  const wfit = () => { wc.width = innerWidth; wc.height = innerHeight; };
  wfit(); addEventListener('resize', wfit);
  const cssv = v => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
  const R = (a, b) => a + Math.random() * (b - a);
  const pick = a => a[Math.floor(Math.random() * a.length)];
  const LEAF = ['#FF8A2B', '#F2B13A', '#D9542B', '#E8C547', '#C2462B', '#9BBF3A'];
  const WRATE = { snow: 42, stars: 13, confetti: 45, leaves: 9, hearts: 9, bubbles: 7, cats: 4.5, rain: 130 };
  let wnow = null, wp = [], wraf = 0, wprev = 0, wacc = 0, wpal = null, wink = '#2E0C24';
  function weather(kind, secs) {
    if (!WRATE[kind]) return;
    const s = Math.max(5, Math.min(300, +secs || 45)), t = performance.now();
    wpal = ['--pink', '--mint', '--yellow', '--pink-hot', '--cream'].map(cssv).filter(Boolean);
    if (wpal.length < 3) wpal = COLORS.slice();
    wink = cssv('--plum') || '#2E0C24';
    wnow = { kind, t0: t, end: t + s * 1000 };
    if (!wraf) { wprev = t; wraf = requestAnimationFrame(wtick); }
  }
  function wspawn(k) {
    const w = wc.width, h = wc.height, pal = wpal;
    switch (k) {
      case 'snow': return { k, x: R(-40, w + 40), y: -20, vx: R(-15, 15), vy: R(45, 110), r: R(2.5, 9), sw: R(20, 50), ph: R(0, 6.3), fq: R(.5, 1.4), rot: R(0, 6.3), vr: R(-.5, .5) };
      case 'stars': return Math.random() < .08
        ? { k: 'shoot', x: R(w * .3, w * 1.1), y: R(-40, h * .3), vx: -R(700, 1000), vy: R(280, 420), life: 1.1, c: pal[2] }
        : { k, x: R(0, w), y: -20, vx: R(-10, 10), vy: R(60, 130), r: R(8, 18), rot: R(0, 6.3), vr: R(-1.5, 1.5), ph: R(0, 6.3), fq: R(2, 4), c: pick(pal) };
      case 'confetti': return { k, x: R(0, w), y: -20, vx: R(-30, 30), vy: R(90, 190), r: R(7, 13), rot: R(0, 6.3), vr: R(-3, 3), ph: R(0, 6.3), fq: R(4, 9), c: pick(pal) };
      case 'leaves': return { k, x: R(-80, w), y: -30, vx: R(20, 60), vy: R(55, 110), r: R(16, 28), rot: R(0, 6.3), vr: R(-1.6, 1.6), sw: R(40, 90), ph: R(0, 6.3), fq: R(.6, 1.3), c: pick(LEAF.concat([pal[2]])) };
      case 'hearts': return { k, x: R(0, w), y: h + 30, vx: 0, vy: -R(70, 140), r: R(14, 28), sw: R(15, 40), ph: R(0, 6.3), fq: R(.8, 1.6), life: R(5, 9), c: pick(pal.slice(0, 4)) };
      case 'bubbles': return { k, x: R(0, w), y: h + 40, vx: 0, vy: -R(50, 110), r: R(10, 30), sw: R(10, 30), ph: R(0, 6.3), fq: R(.7, 1.5), life: R(4, 9), c: pick(pal) };
      case 'cats': return { k, x: R(0, w), y: -50, vx: R(-20, 20), vy: R(90, 170), r: R(24, 38), rot: R(-.5, .5), vr: R(-.8, .8), ginger: Math.random() < .35, eye: pal[2], ph: R(0, 6.3), fq: 1 };
      case 'rain': return { k, x: R(-100, w + 250), y: R(-80, -10), vx: -140, vy: R(950, 1250), len: R(16, 32) };
    }
  }
  function star5(c, r) { c.beginPath(); for (let i = 0; i < 10; i++) { const rr = i % 2 ? r * .45 : r, a = -Math.PI / 2 + i * Math.PI / 5; c.lineTo(Math.cos(a) * rr, Math.sin(a) * rr); } c.closePath(); }
  function heart(c, r) { c.beginPath(); c.moveTo(0, r * .9); c.bezierCurveTo(-r * 1.3, 0, -r * .6, -r * 1.1, 0, -r * .4); c.bezierCurveTo(r * .6, -r * 1.1, r * 1.3, 0, 0, r * .9); c.closePath(); }
  function wdraw(p) {
    const c = wx, x = p.x + (p.sw ? Math.sin(p.ph) * p.sw : 0);
    c.save(); c.translate(x, p.y); c.lineJoin = 'round'; c.lineCap = 'round';
    switch (p.k) {
      case 'snow':
        c.globalAlpha = .9; c.rotate(p.rot);
        if (p.r < 5) { c.fillStyle = '#FFFFFF'; c.beginPath(); c.arc(0, 0, p.r * .6, 0, 7); c.fill(); break; }
        c.strokeStyle = '#FFFFFF'; c.lineWidth = Math.max(1.5, p.r / 4); c.beginPath();
        for (let i = 0; i < 3; i++) { const a = i * Math.PI / 3, ca = Math.cos(a), sa = Math.sin(a); c.moveTo(-ca * p.r, -sa * p.r); c.lineTo(ca * p.r, sa * p.r); }
        for (let i = 0; i < 6; i++) { const a = i * Math.PI / 3, m = p.r * .55, b = p.r * .3;
          c.moveTo(Math.cos(a) * m, Math.sin(a) * m); c.lineTo(Math.cos(a) * m + Math.cos(a + .8) * b, Math.sin(a) * m + Math.sin(a + .8) * b);
          c.moveTo(Math.cos(a) * m, Math.sin(a) * m); c.lineTo(Math.cos(a) * m + Math.cos(a - .8) * b, Math.sin(a) * m + Math.sin(a - .8) * b); }
        c.stroke(); break;
      case 'stars':
        c.globalAlpha = .7 + .3 * Math.sin(p.ph); c.rotate(p.rot); star5(c, p.r);
        c.fillStyle = p.c; c.fill(); c.strokeStyle = wink; c.lineWidth = 2; c.stroke(); break;
      case 'shoot': {
        const a = Math.max(0, p.life / 1.1), tx = -p.vx * .14, ty = -p.vy * .14, g = c.createLinearGradient(0, 0, tx, ty);
        g.addColorStop(0, p.c); g.addColorStop(1, 'rgba(255,255,255,0)');
        c.globalAlpha = a; c.strokeStyle = g; c.lineWidth = 4; c.beginPath(); c.moveTo(0, 0); c.lineTo(tx, ty); c.stroke();
        c.fillStyle = '#FFFFFF'; star5(c, 7); c.fill(); break; }
      case 'confetti':
        c.rotate(p.rot); c.scale(1, Math.cos(p.ph)); c.fillStyle = p.c; c.fillRect(-p.r, -p.r * .45, p.r * 2, p.r * .9); break;
      case 'leaves':
        c.globalAlpha = .95; c.rotate(p.rot); c.beginPath(); c.moveTo(0, -p.r);
        c.quadraticCurveTo(p.r * .8, -p.r * .2, 0, p.r); c.quadraticCurveTo(-p.r * .8, -p.r * .2, 0, -p.r); c.closePath();
        c.fillStyle = p.c; c.fill(); c.strokeStyle = wink; c.lineWidth = 2; c.stroke();
        c.beginPath(); c.moveTo(0, -p.r * .75); c.lineTo(0, p.r * 1.25); c.globalAlpha = .55; c.stroke(); break;
      case 'hearts':
        c.globalAlpha = Math.min(1, p.life / 1.2, (p.max - p.life) / .4); c.rotate(Math.sin(p.ph) * .25); heart(c, p.r);
        c.fillStyle = p.c; c.fill(); c.strokeStyle = wink; c.lineWidth = 2.5; c.stroke(); break;
      case 'bubbles':
        c.globalAlpha = Math.min(1, (p.max - p.life) / .4) * .85;
        c.beginPath(); c.arc(0, 0, p.r, 0, 7); c.fillStyle = 'rgba(255,255,255,.08)'; c.fill();
        c.strokeStyle = p.c; c.lineWidth = 2.5; c.stroke();
        c.beginPath(); c.arc(0, 0, p.r * .65, Math.PI * 1.1, Math.PI * 1.45); c.strokeStyle = 'rgba(255,255,255,.85)'; c.lineWidth = 3; c.stroke(); break;
      case 'pop': {
        const k2 = 1 - p.life / p.max; c.globalAlpha = 1 - k2; c.strokeStyle = p.c; c.lineWidth = 2; c.setLineDash([4, 6]);
        c.beginPath(); c.arc(0, 0, p.r * (1 + k2 * .8), 0, 7); c.stroke(); break; }
      case 'cats': {
        const r = p.r, fur = p.ginger ? '#F4A26B' : '#17121C', line = p.ginger ? wink : (cssv('--cream') || '#FFF8FB');
        c.rotate(p.rot); c.fillStyle = fur; c.strokeStyle = line; c.lineWidth = 2.5;
        c.beginPath(); c.moveTo(-r * .9, -r * .2); c.lineTo(-r * .75, -r * 1.15); c.lineTo(-r * .2, -r * .8);
        c.moveTo(r * .9, -r * .2); c.lineTo(r * .75, -r * 1.15); c.lineTo(r * .2, -r * .8); c.fill(); c.stroke();
        c.beginPath(); c.ellipse(0, 0, r, r * .85, 0, 0, 7); c.fill(); c.stroke();
        const blink = Math.sin(p.ph * 1.7) > .96;
        c.fillStyle = p.ginger ? '#78EEC4' : p.eye;
        for (const s of [-1, 1]) {
          c.beginPath(); c.ellipse(s * r * .38, -r * .08, r * .2, blink ? r * .03 : r * .22, 0, 0, 7); c.fill();
          if (!blink) { c.fillStyle = '#120A10'; c.beginPath(); c.ellipse(s * r * .38, -r * .08, r * .06, r * .17, 0, 0, 7); c.fill(); c.fillStyle = p.ginger ? '#78EEC4' : p.eye; }
        }
        c.fillStyle = '#FF7ABE'; c.beginPath(); c.moveTo(-r * .1, r * .22); c.lineTo(r * .1, r * .22); c.lineTo(0, r * .34); c.closePath(); c.fill(); break; }
      case 'rain':
        c.globalAlpha = .55; c.strokeStyle = '#A9D6F5'; c.lineWidth = 2;
        c.beginPath(); c.moveTo(0, 0); c.lineTo(-p.vx * p.len / p.vy, -p.len); c.stroke(); break;
    }
    c.restore();
  }
  function wtick(t) {
    const dt = Math.min(.05, Math.max(0, (t - wprev) / 1000)); wprev = t;
    const w = wc.width, h = wc.height;
    if (wnow) {
      if (t >= wnow.end) wnow = null;
      else {
        const ramp = Math.min(1, (t - wnow.t0) / 2000), tail = Math.min(1, (wnow.end - t) / 2500);
        wacc += WRATE[wnow.kind] * Math.max(.5, w / 1920) * ramp * tail * dt;
        while (wacc >= 1 && wp.length < 700) { wacc -= 1; const p = wspawn(wnow.kind); if (p.life) p.max = p.life; wp.push(p); }
        if (wacc >= 1) wacc = 0;
      }
    }
    wx.clearRect(0, 0, w, h);
    const born = [];
    wp = wp.filter(p => {
      p.x += p.vx * dt; p.y += p.vy * dt;
      if (p.vr) p.rot += p.vr * dt;
      if (p.ph !== undefined) p.ph += (p.fq || 1) * dt;

    el.querySelector('.amount').animate([{ transform: 'rotate(5deg) scale(0)' }, { transform: 'rotate(5deg) scale(1.4)', offset: .5 }, { transform: 'rotate(5deg) scale(1)' }],

    const hold = Math.max(base_ms, Math.min(max_ms, base_ms + msg.length * 55));
    const go = () => el.animate(leave, { duration: 400, easing: 'ease-in', fill: 'forwards' }).onfinish = () => { el.remove(); tell(v.donId, 'done'); setTimeout(next, 500); };
    const sync = v.klod && v.lips ? lipSync(el, v.lips) : null;
    if (!sync) return setTimeout(go, hold);
    // Клодик говорит голосом: карточка держится, пока он не договорит
    const t0 = Date.now();
    (function wait() {
      const now = Date.now(), end = sync.end();
      if (now - t0 > 60000 || (now - t0 > base_ms && (end ? now > end + 900 : sync.lost))) return go();
      setTimeout(wait, 250);

  // рот Клодика под озвучку: tts.html присылает громкость фразы по кадрам и когда она зазвучала (/hub/tts/lips)
  function lipSync(el, key) {
    const box = el.querySelector('.klod'), mouth = el.querySelector('.mouth');
    const s = { data: null, lost: false, end: () => s.data ? s.data.start + s.data.env.length * s.data.step * 1000 : 0 };
    box.classList.add('sync');
    const t0 = Date.now();
    (async function ask() {
      try { const d = await getJ('/hub/tts/lips?k=' + encodeURIComponent(key)); if (d && d.env) s.data = d; } catch (e) { }
      if (s.data || !el.isConnected) return;
      if (Date.now() - t0 > 20000) { s.lost = true; box.classList.remove('sync'); mouth.style.transform = ''; return; }   // озвучка так и не заиграла
      setTimeout(ask, 300);
    })();
    let lv = 0;
    (function frame() {
      if (!el.isConnected) return;
      const d = s.data; let want = 0;
      if (d) { const i = Math.floor((Date.now() - d.start) / 1000 / d.step); want = i >= 0 && i < d.env.length ? d.env[i] : 0; }
      lv += (want - lv) * (want > lv ? .6 : .35);
      if (!s.lost) mouth.style.transform = `scaleY(${(.2 + lv * 1.1).toFixed(3)})`;
      requestAnimationFrame(frame);
    })();
    return s;
  }
  function next() { const d = queue.shift(); if (d) show(d); else busy = false; }
  function push(d) { queue.push(donView(d)); if (busy) tell(d.id, 'queued'); else next(); }

  // алерты Twitch приходят через шину Глупостанции
  async function twRelay() {
    let after = -1, boot = null;
    const go = async () => {
      let again = false;
      try {
        const j = await getJ('/hub/events?who=alert&after=' + after);
        // Глупостанцию перезапустили: номера событий пошли заново — забираем всё с начала, иначе новые события потеряются
        const restarted = (j.boot && boot && j.boot !== boot) || (!j.boot && after > 0 && j.last < after);
        // Глупостанцию перезапустили с новыми файлами — страница в OBS сама обновляется, чтобы не висеть на старой версии
        if (j.boot && boot && j.boot !== boot) { setTimeout(() => location.reload(), 300); return; }
        if (j.boot) boot = j.boot;
        if (restarted) { after = 0; again = true; }
        else {
          if (after >= 0) (j.events || []).forEach(e => {
            if (e.type === 'tw') pushTw(e.data);
            else if (e.type === 'sb' && e.data && e.data.file) play([e.data.file]);   // саундборд: сразу, без очереди
            else if (e.type === 'wx' && e.data) weather(e.data.kind, e.data.secs);    // погода: сразу, параллельно алертам
          });
          if (typeof j.last === 'number') after = j.last;
        }
      } catch (e) {}
      setTimeout(go, again ? 0 : 1500);
    };
    go();
  }

  // донаты: если Глупостанция не отвечает (перезапуск), ждём и пробуем снова — демо-донаты на стриме не показываем никогда
  function relay() {

        sym = j.symbol || sym; if (j.sounds && j.sounds.length) sounds = j.sounds;

        if (first) { list.forEach(d => { if (!d.test) seen.add(d.id); }); first = false; }
        for (const d of list) if (!seen.has(d.id)) { seen.add(d.id); push(d); }
        wait = 2000;
      } catch (e) { wait = Math.min(15000, Math.round(wait * 1.6)); }
      setTimeout(tick2, wait);
    };
    tick2();
  }
