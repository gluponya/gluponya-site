<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<script src="/st/mock_hub.js"></script>
<title>gluponya фон</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #2E0C24; }
  canvas { display: block; position: absolute; left: 0; top: 0; width: 100vw; height: 100vh; }
  /* два слоя неподвижного фона: при смене палитры новый проявляется поверх старого (это делает сам браузер, без перерисовки) */
  .bg { transition: opacity 1.5s linear; }
  #c { z-index: 3; }
  /* Скин «Терминал» (07.11): полосы развёртки и медленная светлая полоса, как у старого монитора */
  #scan { display: none; position: absolute; inset: 0; z-index: 4; pointer-events: none;
          background: repeating-linear-gradient(0deg, rgba(0,0,0,.22) 0 2px, transparent 2px 5px); }
  #scan::after { content: ""; position: absolute; left: 0; right: 0; height: 22vh; top: -22vh;
                 background: linear-gradient(to bottom, transparent, rgba(255,255,255,.035), transparent);
                 animation: sweep 9s linear infinite; }
  @keyframes sweep { to { transform: translateY(144vh); } }
  :root[data-skin="terminal"] #scan { display: block; }
  :root[data-skin="vhs"] #scan { display: block; }   /* форма «Кассета» (07.11): та же развёртка */
  @media (prefers-reduced-motion: reduce) { #scan::after { animation: none; } }
</style>
<script src="/static/theme.js"></script>
</head>
<body>
<canvas id="bgA" class="bg"></canvas><canvas id="bgB" class="bg"></canvas>
<canvas id="c"></canvas><div id="scan"></div>
<script>
// Фон для OBS: сливовый фон + мерцающие 4-лучевые искорки gluponya.
// Живёт на Глупостанции: http://127.0.0.1:8765/static/bg.html (1920×1080, самым нижним слоем).
// Когда зритель берёт награду «Сменить цвет оверлея», сам фон, свечение, точки и все искорки плавно перекрашиваются в его палитру.
// Бережём OBS: неподвижный фон рисуется один раз в отдельный слой; свечение и искорки — готовые картинки-штампы
// для каждого цвета (перерисовываются только при смене цвета); анимация не чаще 30 кадров в секунду.
const c = document.getElementById('c');
const ctx = c.getContext('2d');
const BG = [document.getElementById('bgA'), document.getElementById('bgB')];
const BASE = { pink: '#FF7ABE', hot: '#FF4FA3', mint: '#78EEC4', yellow: '#FFD84D', cream: '#FFF8FB', plum: '#2E0C24' };
let P = Object.assign({}, BASE);                // текущая палитра
const palette = () => [P.pink, P.pink, P.mint, P.mint, P.yellow, P.hot, P.cream];
let W, H, S, fade = 1, fadeT0 = 0, stars = [], dots = [];
let shown = 0;
let SKIN = '';                                   // скин с Глупостанции: 'terminal' — без искорок, тёмное стекло с сеткой                                   // какой из двух слоёв фона сейчас показан
const rnd = (a, b) => a + Math.random() * (b - a);
const rgb = h => { const n = parseInt(h.slice(1), 16); return [n >> 16, (n >> 8) & 255, n & 255]; };
const hexA = (hex, a) => { const [r, g, b] = rgb(hex); return `rgba(${r},${g},${b},${a})`; };
const mix = (a, b, t) => { const x = rgb(a), y = rgb(b); return '#' + x.map((v, i) => Math.round(v + (y[i] - v) * t).toString(16).padStart(2, '0')).join(''); };

function makeBg(cv) {
  cv.width = W; cv.height = H;
  const g = cv.getContext('2d');
  if (SKIN === 'terminal') return makeTerminalBg(cv, g);
  if (SKIN === 'notebook') return makeNotebookBg(cv, g);   // фон формы — бумага; «залитый экран» 07.11 был из-за tama.html, не фона
  if (SKIN === 'polaroid') return makePolaroidBg(cv, g);
  if (SKIN === 'receipt') return makeReceiptBg(cv, g);
  if (SKIN === 'vhs') return makeVhsBg(cv, g);
  g.fillStyle = P.plum;
  g.fillRect(0, 0, W, H);
  const glow = (x, y, r, col) => {
    const gr = g.createRadialGradient(x, y, 0, x, y, r);
    gr.addColorStop(0, col);
    gr.addColorStop(1, hexA(P.plum, 0));
    g.fillStyle = gr;
    g.fillRect(0, 0, W, H);
  };
  glow(W * 0.18, H * 0.22, W * 0.55, hexA(P.pink, 0.16));
  glow(W * 0.85, H * 0.85, W * 0.50, hexA(P.mint, 0.09));
  glow(W * 0.80, H * 0.10, W * 0.35, hexA(P.hot, 0.08));
  const k = W / 1920, step = 56 * k, dr = 3.25 * k;
  g.fillStyle = hexA(P.pink, 0.16);
  for (let y = step / 2; y < H + step; y += step) {
    for (let x = step / 2; x < W + step; x += step) {
      g.beginPath();
      g.arc(x, y, dr, 0, Math.PI * 2);
      g.fill();
    }
  }
  const v = g.createRadialGradient(W / 2, H / 2, Math.min(W, H) * 0.35, W / 2, H / 2, Math.max(W, H) * 0.75);
  v.addColorStop(0, 'rgba(20,4,15,0)');
  v.addColorStop(1, 'rgba(20,4,15,0.55)');
  g.fillStyle = v;
  g.fillRect(0, 0, W, H);
  return cv;
}

// Формы оверлея (07.11): фон под Тетрадь (клетчатый лист с полем), Полароид (светлый с мягкими пятнами) и Кассету (тёмный с развёрткой).
// Чек оставляет обычный фон. Искорок в этих трёх нет.
function makeNotebookBg(cv, g) {
  const paper = mix('#FFFFFF', P.plum, 0.05), grid = mix('#FFFFFF', P.plum, 0.2);
  g.fillStyle = paper;
  g.fillRect(0, 0, W, H);
  const k = W / 1920, step = 44 * k;
  g.strokeStyle = grid;
  g.lineWidth = Math.max(1, k);
  g.beginPath();
  for (let x = step; x < W; x += step) { g.moveTo(Math.round(x) + .5, 0); g.lineTo(Math.round(x) + .5, H); }
  for (let y = step; y < H; y += step) { g.moveTo(0, Math.round(y) + .5); g.lineTo(W, Math.round(y) + .5); }
  g.stroke();
  g.fillStyle = hexA(P.hot, 0.8);                 // поле слева, как в тетради
  g.fillRect(Math.round(W * 0.09), 0, Math.max(2, 2 * k), H);
  return cv;
}
function makePolaroidBg(cv, g) {
  g.fillStyle = mix('#FFFFFF', P.pink, 0.38);
  g.fillRect(0, 0, W, H);
  const glow = (x, y, r, col) => {
    const gr = g.createRadialGradient(x, y, 0, x, y, r);
    gr.addColorStop(0, col);
    gr.addColorStop(1, hexA(col.length === 7 ? col : P.pink, 0));
    g.fillStyle = gr;
    g.fillRect(0, 0, W, H);
  };
  glow(W * 0.2, H * 0.8, W * 0.32, hexA(P.yellow, 0.35));
  glow(W * 0.85, H * 0.2, W * 0.3, hexA(P.hot, 0.25));
  return cv;
}
function makeReceiptBg(cv, g) {
  // прилавок: тёмная столешница палитры с мелкой диагональной фактурой и светлым пятном сверху, как от лампы над кассой
  g.fillStyle = mix(P.plum, '#000000', 0.2);
  g.fillRect(0, 0, W, H);
  const k = W / 1920;
  g.strokeStyle = hexA('#FFFFFF', 0.035);
  g.lineWidth = Math.max(1, k);
  g.beginPath();
  for (let x = -H; x < W; x += 14 * k) { g.moveTo(x, 0); g.lineTo(x + H, H); }
  g.stroke();
  const gr = g.createRadialGradient(W * 0.5, -H * 0.2, 0, W * 0.5, -H * 0.2, H * 1.1);
  gr.addColorStop(0, hexA('#FBF7EE', 0.16));
  gr.addColorStop(1, hexA('#FBF7EE', 0));
  g.fillStyle = gr;
  g.fillRect(0, 0, W, H);
  return cv;
}
function makeVhsBg(cv, g) {
  const gr = g.createLinearGradient(0, 0, 0, H);
  gr.addColorStop(0, mix(P.plum, '#000000', 0.45));
  gr.addColorStop(1, P.plum);
  g.fillStyle = gr;
  g.fillRect(0, 0, W, H);
  const v = g.createRadialGradient(W / 2, H / 2, Math.min(W, H) * 0.3, W / 2, H / 2, Math.max(W, H) * 0.75);
  v.addColorStop(0, 'rgba(0,0,0,0)');
  v.addColorStop(1, 'rgba(0,0,0,0.55)');
  g.fillStyle = v;
  g.fillRect(0, 0, W, H);
  return cv;
}

function makeTerminalBg(cv, g) {
  g.fillStyle = mix(P.plum, '#000000', 0.35);
  g.fillRect(0, 0, W, H);
  const gr = g.createRadialGradient(W / 2, H / 2, 0, W / 2, H / 2, W * 0.6);
  gr.addColorStop(0, hexA(P.pink, 0.10));
  gr.addColorStop(1, hexA(P.plum, 0));
  g.fillStyle = gr;
  g.fillRect(0, 0, W, H);
  const k = W / 1920, step = 48 * k;
  g.strokeStyle = hexA(P.pink, 0.09);
  g.lineWidth = Math.max(1, k);
  g.beginPath();
  for (let x = step; x < W; x += step) { g.moveTo(Math.round(x) + .5, 0); g.lineTo(Math.round(x) + .5, H); }
  for (let y = step; y < H; y += step) { g.moveTo(0, Math.round(y) + .5); g.lineTo(W, Math.round(y) + .5); }
  g.stroke();
  const v = g.createRadialGradient(W / 2, H / 2, Math.min(W, H) * 0.3, W / 2, H / 2, Math.max(W, H) * 0.72);
  v.addColorStop(0, 'rgba(0,0,0,0)');
  v.addColorStop(1, 'rgba(0,0,0,0.7)');
  g.fillStyle = v;
  g.fillRect(0, 0, W, H);
  return cv;
}

function sparkle(g, r, cx = 0, cy = 0) {
  const q = r * 0.13;
  g.beginPath();
  g.moveTo(cx, cy - r);
  g.quadraticCurveTo(cx + q, cy - q, cx + r, cy);
  g.quadraticCurveTo(cx + q, cy + q, cx, cy + r);
  g.quadraticCurveTo(cx - q, cy + q, cx - r, cy);
  g.quadraticCurveTo(cx - q, cy - q, cx, cy - r);
  g.closePath();
}

// ---- штампы: свечение, искорка и её светлая серединка, нарисованные заранее в нескольких размерах ----
// размер штампа — ближайший сверху к нужному (уменьшение не больше чем вдвое, поэтому края остаются чёткими)
let LV = [];
const sprites = new Map();
function levelFor(r) { for (const l of LV) if (l >= r) return l; return LV[LV.length - 1]; }
function sprite(kind, col, rr) {
  const key = kind + col + rr;
  let sp = sprites.get(key);
  if (sp) return sp;
  if (sprites.size > 600) sprites.clear();       // в «радуге» цветов много — старые выкидываем
  const cv = document.createElement('canvas');
  const rad = kind === 'g' ? rr * 1.8 : kind === 's' ? rr : rr * 0.32;
  const size = 2 * Math.ceil(rad) + 4, h = size / 2;
  cv.width = cv.height = size;
  const g = cv.getContext('2d');
  if (kind === 'g') {
    const gl = g.createRadialGradient(h, h, 0, h, h, rad);
    gl.addColorStop(0, hexA(col, 0.28));
    gl.addColorStop(1, hexA(col, 0));
    g.fillStyle = gl;
    g.beginPath();
    g.arc(h, h, rad, 0, Math.PI * 2);
    g.fill();
  } else {
    g.fillStyle = kind === 's' ? col : 'rgba(255,248,251,0.85)';
    sparkle(g, rad, h, h);
    g.fill();
  }
  sp = { cv, h };
  sprites.set(key, sp);
  return sp;
}

function init() {
  W = c.width = innerWidth;
  H = c.height = innerHeight;
  S = Math.min(W / 1920, H / 1080);
  fade = 1;
  BG.forEach(b => { b.style.transition = 'none'; b.style.opacity = '0'; b.style.zIndex = '0'; });
  makeBg(BG[shown]);
  BG[shown].style.opacity = '1';
  void BG[shown].offsetWidth;
  BG.forEach(b => b.style.transition = '');
  LV = [];
  for (let l = 4; ; l *= 2) { LV.push(l); if (l >= 58 * S) break; }
  sprites.clear();
  const cols = palette();
  stars = [];
  // раскладка 22.10: искорок втрое меньше и они мельче, чтобы не шумели (?many — как раньше)
  const MANY = new URLSearchParams(location.search).has('many');
  const n = Math.round((MANY ? 42 : 14) * (W * H) / (1920 * 1080));
  let tries = 0;
  while (stars.length < n && tries < 5000) {
    tries++;
    const big = Math.random() < (MANY ? 0.14 : 0.04);
    const slot = (Math.random() * cols.length) | 0;
    const s = {
      x: rnd(0, W), y: rnd(0, H),
      r: (big ? rnd(36, 58) : MANY ? rnd(10, 28) : rnd(8, 18)) * S,
      slot, col: cols[slot], from: cols[slot], to: cols[slot],
      ph: rnd(0, Math.PI * 2), sp: rnd(0.6, 1.5),
      rot: rnd(-0.25, 0.25), spin: rnd(-0.15, 0.15),
      vy: rnd(-9, -3) * S, vx: rnd(-2, 2) * S
    };
    if (stars.every(o => Math.hypot(o.x - s.x, o.y - s.y) > (o.r + s.r) * 2.4)) stars.push(s);
  }
  dots = [];
  const m = Math.round(70 * (W * H) / (1920 * 1080));
  for (let i = 0; i < m; i++) {
    dots.push({ x: rnd(0, W), y: rnd(0, H), r: rnd(1.5, 4.5) * S, a: rnd(0.12, 0.45),
                vx: rnd(-4, 4) * S, vy: rnd(-10, -3) * S, ph: rnd(0, 6.28) });
  }
}

// плавная смена палитры: старый фон растворяется, искорки перетекают в новые цвета
let dotFrom = BASE.pink, dotTo = BASE.pink, curDot = BASE.pink;
function setPalette(np) {
  if (['pink', 'mint', 'hot', 'yellow', 'plum'].every(k => np[k] === P[k])) return;
  P = np;
  // как раньше: старый фон остаётся снизу, новый проявляется поверх за 1.5 с
  // (пришла ещё одна палитра посреди перехода — новый слой перерисовывается и проявляется заново)
  const top = 1 - shown, under = shown;
  const L = BG[top];
  L.style.transition = 'none'; L.style.opacity = '0'; L.style.zIndex = '2'; BG[under].style.zIndex = '1';
  makeBg(L);
  void L.offsetWidth;
  L.style.transition = ''; L.style.opacity = '1';
  fade = 0; fadeT0 = performance.now();
  const cols = palette();
  stars.forEach(s => { s.from = s.col; s.to = cols[s.slot]; });
  dotFrom = curDot; dotTo = P.pink;
}
function fadeDone() {
  // переход закончился: верхний слой становится основным, старый прячем
  const top = 1 - shown;
  BG[shown].style.transition = 'none'; BG[shown].style.opacity = '0'; BG[shown].style.zIndex = '0';
  BG[top].style.zIndex = '1';
  shown = top;
}

const FRAME_MS = 1000 / 30;                      // не чаще 30 кадров в секунду
let last = performance.now(), lastDraw = -1e9;
function frame(now) {
  requestAnimationFrame(frame);
  if (now - lastDraw < FRAME_MS - 4) return;
  lastDraw = now;
  const dt = Math.min(0.1, (now - last) / 1000);
  last = now;
  const t = now / 1000;
  if (fade < 1) {
    fade = Math.min(1, (now - fadeT0) / 1500);
    if (fade >= 1) fadeDone();
  }
  const fq = Math.round(fade * 24) / 24;        // штампы в переходе — 24 оттенка на 1.5 с
  ctx.clearRect(0, 0, W, H);
  if (SKIN === 'terminal' || SKIN === 'vhs' || SKIN === 'notebook' || SKIN === 'polaroid' || SKIN === 'receipt') return;   // без искорок: терминал и формы 07.11 (и OBS меньше работы)
  const dcol = curDot = fade < 1 ? mix(dotFrom, dotTo, fade) : dotTo;

  ctx.fillStyle = dcol;
  for (const d of dots) {
    d.x += d.vx * dt; d.y += d.vy * dt;
    if (d.y < -10) { d.y = H + 10; d.x = rnd(0, W); }
    if (d.x < -10) d.x = W + 10; else if (d.x > W + 10) d.x = -10;
    ctx.globalAlpha = d.a * (0.7 + 0.3 * Math.sin(t * 1.3 + d.ph));
    ctx.beginPath();
    ctx.arc(d.x, d.y, d.r, 0, Math.PI * 2);
    ctx.fill();
  }

  for (const s of stars) {
    s.x += s.vx * dt; s.y += s.vy * dt;
    if (s.y < -s.r * 2) { s.y = H + s.r * 2; s.x = rnd(0, W); }
    if (s.x < -s.r * 2) s.x = W + s.r * 2; else if (s.x > W + s.r * 2) s.x = -s.r * 2;
    s.col = fade < 1 ? mix(s.from, s.to, fade) : s.to;
    const col = fade < 1 ? mix(s.from, s.to, fq) : s.to;
    const k = (Math.sin(t * s.sp + s.ph) + 1) / 2;
    const sc = 0.35 + 0.65 * Math.pow(k, 1.4);
    const al = 0.25 + 0.75 * k;
    const r = s.r * sc;
    const rr = levelFor(r), z = r / rr;
    const g = sprite('g', col, rr), sp = sprite('s', col, rr), core = sprite('c', '', rr);
    ctx.globalAlpha = al;
    ctx.setTransform(1, 0, 0, 1, s.x, s.y);
    ctx.drawImage(g.cv, -g.h * z, -g.h * z, g.h * 2 * z, g.h * 2 * z);
    ctx.rotate(s.rot + s.spin * t);
    ctx.drawImage(sp.cv, -sp.h * z, -sp.h * z, sp.h * 2 * z, sp.h * 2 * z);
    ctx.drawImage(core.cv, -core.h * z, -core.h * z, core.h * 2 * z, core.h * 2 * z);
  }
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.globalAlpha = 1;
}

// цвет со Глупостанции (награда «Сменить цвет оверлея»): общий опрос из theme.js, свой запрос к Глупостанции не нужен
function onTheme(j) {
  const sk = j.skin && j.skin !== 'none' ? String(j.skin) : '';
  const forced = new URLSearchParams(location.search).get('skin');
  const want = forced != null ? forced : sk;
  if (want !== SKIN) { SKIN = want; P = Object.assign({}, P, { plum: '' }); }   // фон перерисуется с плавным переходом
  const p = j.pal;
  setPalette(p ? { pink: p.pink, hot: p.hot, mint: p.mint, yellow: p.yellow, cream: BASE.cream, plum: p.plum }
             : j.color ? { pink: j.color, hot: j.dark, mint: j.light, yellow: mix(j.light, BASE.yellow, .35),
                           cream: BASE.cream, plum: mix(BASE.plum, j.dark, .12) } : Object.assign({}, BASE));
}

addEventListener('resize', init);
init();
requestAnimationFrame(frame);
if (window.gluTheme) gluTheme.on(onTheme);
</script>
</body>
</html>
