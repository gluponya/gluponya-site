<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<script src="/st/mock_hub.js"></script>
<title>Сегодня делаем</title>
<link rel="stylesheet" href="/static/hub.css">
<style>
  /* «Сегодня делаем: …». OBS: Браузер, URL http://127.0.0.1:8765/static/topic.html, 1280×540 (как старое видео-плашка).
     Тексты меняются на пульте → «Плашки на экране». Цвет главной плашки — сиреневый, а при «Сменить цвет оверлея» — цвет зрителя.
     ?preview — шахматный фон. */
  :root { --lav: #B48CFF; --shadow-ink: #1E0818; }
  html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: transparent; }
  body.preview { background: repeating-conic-gradient(#241020 0 25%, #2c1428 0 50%) 0 0/40px 40px; }
  #stage { position: absolute; left: 0; top: 0; width: 1280px; height: 540px; transform-origin: 0 0; }
  .chip { position: absolute; display: inline-block; font-family: var(--display); font-weight: 900; text-transform: uppercase;
          color: var(--plum); white-space: nowrap; border-radius: 16px; box-shadow: 8px 8px 0 var(--shadow-ink);
          transition: background-color 1.4s; }
  .chip::after { content: ""; position: absolute; left: 14px; right: 14px; top: 7px; height: 7px; border-radius: 6px;
                 background: rgba(255,255,255,.35); }
  #k { left: 86px; top: 34px; font-size: 44px; padding: 16px 24px 12px; background: var(--mint); transform: rotate(-2deg); }
  #t { left: 122px; top: 106px; font-size: 104px; line-height: 1; padding: 14px 44px 8px; background: var(--lav); border-radius: 22px; }
  #s { left: 346px; top: 212px; font-size: 38px; padding: 14px 24px 10px; background: var(--yellow); transform: rotate(1.5deg); }
  .in #k { animation: popk .6s cubic-bezier(.2,1.6,.4,1) both, bob 4s ease-in-out .6s infinite; }
  .in #t { animation: popt .7s cubic-bezier(.2,1.5,.4,1) .12s both, bob2 4.6s ease-in-out .8s infinite; }
  .in #s { animation: pops .6s cubic-bezier(.2,1.6,.4,1) .26s both, bob3 3.8s ease-in-out 1s infinite; }
  @keyframes popk { from { opacity: 0; transform: translateY(-30px) rotate(-8deg) scale(.6); } }
  @keyframes popt { from { opacity: 0; transform: scale(.4); } }
  @keyframes pops { from { opacity: 0; transform: translateY(30px) rotate(6deg) scale(.6); } }
  @keyframes bob  { 0%, 100% { transform: rotate(-2deg) translateY(0); } 50% { transform: rotate(-3deg) translateY(-4px); } }
  @keyframes bob2 { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(3px) rotate(-.4deg); } }
  @keyframes bob3 { 0%, 100% { transform: rotate(1.5deg) translateY(0); } 50% { transform: rotate(2.5deg) translateY(-3px); } }
  /* блик по главной плашке */
  #t .shine { position: absolute; inset: 0; border-radius: 22px; overflow: hidden; pointer-events: none; }
  #t .shine::before { content: ""; position: absolute; top: -30%; bottom: -30%; width: 120px; left: -200px;
                      background: linear-gradient(90deg, transparent, rgba(255,255,255,.4), transparent); transform: skewX(-20deg);
                      animation: sweep 6s ease-in-out 1.2s infinite; }
  @keyframes sweep { 0% { left: -200px; } 30%, 100% { left: 110%; } }
  .sp { position: absolute; background: var(--yellow); clip-path: polygon(50% 0, 61% 39%, 100% 50%, 61% 61%, 50% 100%, 39% 61%, 0 50%, 39% 39%);
        animation: tw 2.6s ease-in-out infinite; }
  .sp.m { background: var(--mint); }
  @keyframes tw { 0%, 100% { transform: scale(.5) rotate(0); opacity: .5; } 50% { transform: scale(1.1) rotate(45deg); opacity: 1; } }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  /* Формы оверлея (07.11, ревизия): Тетрадь — бумага с пунктиром ручкой, главная маркером; Полароид — белые снимки с тенью;
     Чек — лента с зубчиками; Кассета берёт общий набор hub.css. Тёмный текст на светлом: белый по яркому читался плохо. */
  :root[data-skin="notebook"] .chip { background: #fff !important; color: var(--ink) !important; border: 3px dashed var(--pen); border-radius: 8px !important;
     box-shadow: 0 4px 0 color-mix(in srgb, var(--muted) 60%, transparent) !important; }
  :root[data-skin="notebook"] #k { transform: rotate(-2deg) !important; }
  :root[data-skin="notebook"] #t { background: var(--mark) !important; border-style: solid; transform: none !important; }
  :root[data-skin="notebook"] #s { transform: rotate(1.5deg) !important; color: var(--pen) !important; }
  :root[data-skin="polaroid"] .chip { background: #fff !important; color: var(--ink) !important; border: 0; border-radius: 4px !important;
     box-shadow: 0 10px 24px -8px rgba(40,10,40,.45) !important; font-family: var(--display) !important; font-style: normal; font-weight: 900 !important; text-transform: uppercase !important; }
  :root[data-skin="polaroid"] #k { background: var(--pen) !important; color: var(--ink) !important; font-family: var(--hand) !important; font-style: var(--hand-style, italic); font-weight: 700 !important; text-transform: none !important; transform: rotate(-2deg) !important; }
  :root[data-skin="polaroid"] #t { padding-bottom: 30px !important; transform: rotate(-.6deg) !important; }
  :root[data-skin="polaroid"] #s { transform: rotate(1.5deg) !important; color: var(--pen) !important; }
  :root[data-skin="receipt"] .chip { background: var(--paper) !important; color: var(--ink) !important; border-radius: 0 !important; box-shadow: none !important;
     -webkit-mask: var(--zig); mask: var(--zig); padding-bottom: 22px !important; letter-spacing: .04em; }
  :root[data-skin="receipt"] #k { background: var(--pen) !important; color: var(--ink) !important; -webkit-mask: none; mask: none; padding-bottom: 12px !important; }
  :root[data-skin="receipt"] #s { color: var(--pen) !important; }
  /* Скин «Терминал» (07.11): строки команд вместо наклеек, курсор после главной */
  :root[data-skin="terminal"] .chip { transform: none !important; border-radius: 3px !important; box-shadow: 0 0 26px -6px currentColor, 0 0 0 3px var(--plum) !important; }
  :root[data-skin="terminal"] #k::before { content: "$ "; }
  :root[data-skin="terminal"] #t::after { content: "_"; display: inline-block; margin-left: 10px; animation: t-blink 1s steps(1) infinite; }
  :root[data-skin="terminal"] #s::before { content: "# "; }
  :root[data-skin="terminal"] .in #k, :root[data-skin="terminal"] .in #t, :root[data-skin="terminal"] .in #s { animation: t-type .6s steps(16, end) both; }
  :root[data-skin="terminal"] .in #t { animation-delay: .15s; } :root[data-skin="terminal"] .in #s { animation-delay: .3s; }
  @keyframes t-type { from { clip-path: inset(0 100% 0 0); } to { clip-path: inset(0 0 0 0); } }
</style>
<script src="/static/theme.js"></script>
</head>
<body>
<div id="stage">
  <span class="chip" id="k"></span>
  <span class="chip" id="t"><span id="tt"></span><span class="shine"></span></span>
  <span class="chip" id="s"></span>
  <i class="sp" style="left:44px;top:160px;width:34px;height:34px"></i>
  <i class="sp m" style="left:108px;top:232px;width:22px;height:22px;animation-delay:-1.1s"></i>
  <i class="sp" style="left:1074px;top:36px;width:30px;height:30px;animation-delay:-.6s"></i>
  <i class="sp m" style="left:1030px;top:250px;width:20px;height:20px;animation-delay:-1.8s"></i>
</div>
<script>
(() => {
  const P = new URLSearchParams(location.search), $ = id => document.getElementById(id), stage = $('stage');
  function fit() { stage.style.transform = `scale(${Math.min(innerWidth / 1280, innerHeight / 540)})`; }
  addEventListener('resize', fit); fit();
  let key = '';
  function show(d) {
    const k = JSON.stringify(d); if (k === key) return; key = k;
    stage.style.display = d.on === false ? 'none' : '';
    $('k').textContent = d.kicker || ''; $('tt').textContent = d.title || ''; $('s').textContent = d.sub || '';
    $('k').style.display = d.kicker ? '' : 'none'; $('s').style.display = d.sub ? '' : 'none';
    // длинное название — помельче, чтобы влезло
    const t = $('t'); t.style.fontSize = '104px';
    for (let fs = 104; fs > 48 && t.offsetWidth > 1100; fs -= 4) t.style.fontSize = fs + 'px';
    const s = $('s'); s.style.left = Math.max(160, Math.min(346, 122 + t.offsetWidth - s.offsetWidth - 20)) + 'px';
    s.style.top = (106 + t.offsetHeight - 6) + 'px';
    stage.classList.remove('in'); void stage.offsetWidth; stage.classList.add('in');
  }
  // запрос не висит дольше 4 с, иначе опрос встанет навсегда
  const T = ms => { if (window.AbortSignal && AbortSignal.timeout) return AbortSignal.timeout(ms);
                    const c = new AbortController(); setTimeout(() => c.abort(), ms); return c.signal; };
  async function poll() {
    try { show(await (await fetch('/hub/overlay/topic', { cache: 'no-store', signal: T(4000) })).json()); } catch (e) {}
    setTimeout(poll, 3000);
  }
  if (P.has('preview')) { document.body.classList.add('preview'); show({ kicker: 'Сегодня делаем:', title: 'своего бота', sub: 'донаты + чат-бот + всё-всё' }); }
  else if (/^https?:$/.test(location.protocol)) {
    poll();
    // главная плашка: сиреневая, а при перекраске — в цвет зрителя (тему уже опрашивает theme.js — свой запрос не шлём)
    if (window.gluTheme) gluTheme.on(th => {
      const c = (th.pal && th.pal.pink) || th.color;
      document.documentElement.style.setProperty('--lav', c || '#B48CFF');
    });
  }
})();
</script>
</body>
</html>
